<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14160c">
  <meta name="site-root" content=".">
  <title>Sayan Nandi | About Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
  <noscript><style>.dropdown, .input-line { display: none; }</style></noscript>
  <script type="module" src="/src/pages/portfolio.ts"></script>
</head>

<body>

  <main class="window">

    <header class="toolbar">
      <p class="toolbar-hint">Type a command or pick one from the list.</p>
      <div class="toolbar-actions">
        <nav class="toolbar-nav" aria-label="Site">
          <a id="nav-portfolio" class="nav-pill" href="index.html" aria-current="page">Portfolio</a>
          <a id="nav-blog" class="nav-pill" href="blog/index.html">Blogs</a>
        </nav>
        <div class="dropdown">
          <button id="menu-btn" class="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu">commands</button>
          <div id="menu" class="menu" hidden></div>
        </div>
      </div>
    </header>

    <div class="screen" id="screen">
      <div id="history" role="log" aria-label="Terminal output"></div>

      <div class="prompt input-line">
        <span id="input-user" class="u">sayan@iiitg</span><span id="input-dir" class="dir">~</span><span class="sym">&#10095;</span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type a command">
      </div>
    </div>

    <footer class="status">
      <span id="footer-copy">&copy; 2026 &middot; Sayan Nandi</span>
      <span id="footer-keys" class="keys">Tab complete &middot; Ctrl+L clear</span>
    </footer>

  </main>

</body>
</html>
