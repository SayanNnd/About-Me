<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14160c">
  <meta name="site-root" content="..">
  <meta name="description" content="Write-ups on systems programming, C++, and building things from scratch, by Sayan Nandi.">
  <title>Blogs | Sayan Nandi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/blog.css">
  <script type="module" src="/src/pages/blog-index.ts"></script>
</head>

<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <main class="window">

    <header class="toolbar">
      <p class="toolbar-hint">Write-ups on my projects and experiences.</p>
      <nav class="toolbar-nav" aria-label="Site">
        <a id="nav-portfolio" class="nav-pill" href="../index.html">Portfolio</a>
        <a id="nav-blog" class="nav-pill" href="index.html" aria-current="page">Blogs</a>
      </nav>
    </header>

    <div class="screen" id="screen">

      <section class="block" id="content" tabindex="-1">
        <p class="prompt"><span class="u prompt-user">sayan@iiitg</span><span class="dir prompt-blog-dir">~/blogs</span><span class="sym">&#10095;</span> <span class="cmd">cat README.md</span></p>
        <div class="out md">
          <h1 id="blog-heading"><span class="hash"># </span>Blogs</h1>
          <p id="blog-intro">Write-ups of the things I build and what I learn while building them.</p>
        </div>
      </section>

      <section class="block" id="posts">
        <p class="prompt"><span class="u prompt-user">sayan@iiitg</span><span class="dir prompt-blog-dir">~/blogs</span><span class="sym">&#10095;</span> <span class="cmd">ls posts/</span></p>

        <div id="posts-list" class="out posts"></div>

        <p id="blog-empty-hint" class="hint">New posts will appear here.</p>
      </section>

    </div>

    <footer class="status">
      <span id="footer-copy">&copy; 2026 &middot; Sayan Nandi</span>
    </footer>

  </main>

</body>
</html>
